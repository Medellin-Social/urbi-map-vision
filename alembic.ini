[alembic]
script_location = alembic
prepend_sys_path = .
# Separate from Airflow's public.alembic_version — both share same urbidata DB
version_table = urbi_alembic_version
version_table_schema = public

# DATABASE_URL env var overrides this at runtime
sqlalchemy.url = postgresql://user:pass@localhost/urbidata

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
