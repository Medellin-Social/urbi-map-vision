# ── Servicio Frontend (este archivo) ─────────────────────────────────────────
# Railway service: urbi-map-vision  →  Dockerfile
[build]
builder = "DOCKERFILE"

# Sin healthcheckPath: este archivo es compartido por los 3 servicios
# Dockerfile (WEB, Social-api, social-cron) — Railway nunca separó el
# Config File Path por servicio en el dashboard pese a los comentarios de
# abajo, así que "/" se aplicaba también a social-cron, que es un
# contenedor headless (cron -f) sin nada escuchando en $PORT. Railway
# reintentaba "service unavailable" y mataba el deploy siempre — nunca
# corrió en la nube. Sin healthcheckPath, Railway solo vigila que el
# proceso del contenedor siga vivo (restartPolicyType se conserva).
[deploy]
restartPolicyType = "on_failure"

# ── Servicio Backend ──────────────────────────────────────────────────────────
# Railway service: urbi-api  →  Dockerfile.api
# En Railway: Settings → Source → Dockerfile Path = Dockerfile.api
# startCommand: sh -c 'uvicorn api.main:app --host 0.0.0.0 --port $PORT'

# ── Servicio Cron (datos) ─────────────────────────────────────────────────────
# Railway service: urbi-cron  →  Dockerfile.cron
# En Railway: Settings → Source → Dockerfile Path = Dockerfile.cron
# No public domain needed — servicio interno.
# Comparte las mismas env vars (DATABASE_URL, SENTRY_DSN).
# Ejecuta scripts/refresh_data.py diariamente a las 03:00 UTC.
