urbidata:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    # Sin defaults de password acá a propósito — cero secretos embebidos en
    # el archivo commiteado. scripts/dbt_run.py setea estas env vars desde
    # DATABASE_URL antes de invocar dbt (local o en el cron de Railway).
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: staging
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10

    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: staging
      threads: 8
      keepalives_idle: 0
      connect_timeout: 10
