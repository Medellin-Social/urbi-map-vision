version: 2

models:
  - name: barrios_mercado
    description: >
      Métricas de mercado inmobiliario por barrio.
      Combina precios de venta y arriendo (largo plazo) con datos de Airbnb (AirROI)
      para calcular yield_bruto, ratio_precio_arriendo y yield_airbnb_pct.
      Fuente: stg_listings (listings activos, outliers filtrados) + raw.airbnb_barrios.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: barrio_nombre
        description: "Nombre del barrio según raw.barrios"
        tests:
          - not_null
      - name: municipio
        description: "Municipio del Valle de Aburrá"
        tests:
          - not_null
      - name: n_venta
        description: "Número de listings de venta usados en el cálculo"
      - name: precio_venta_promedio
        description: "Precio promedio de venta (COP)"
      - name: area_promedio_m2
        description: "Área promedio de inmuebles en venta (m²) — proxy para yield_airbnb_pct"
      - name: precio_venta_m2_p50
        description: "Mediana del precio por m² en venta (COP)"
      - name: precio_venta_m2_p25
        description: "Percentil 25 del precio por m² en venta (COP)"
      - name: precio_venta_m2_p75
        description: "Percentil 75 del precio por m² en venta (COP)"
      - name: n_arriendo
        description: "Número de listings de arriendo (apartamentos) usados"
      - name: precio_arriendo_p50
        description: "Mediana del precio de arriendo mensual (COP)"
      - name: precio_arriendo_p25
        description: "Percentil 25 del precio de arriendo mensual (COP)"
      - name: precio_arriendo_p75
        description: "Percentil 75 del precio de arriendo mensual (COP)"
      - name: ratio_precio_arriendo
        description: >
          precio_venta_promedio / (precio_arriendo_p50 * 12).
          Años de arriendo para recuperar el capital. Menor = mejor inversión.
      - name: yield_bruto
        description: >
          (precio_arriendo_p50 * 12) / precio_venta_promedio * 100.
          Rentabilidad bruta anual por arriendo tradicional (%). Mayor = mejor.
      - name: airbnb_n_listings
        description: "Listings activos de Airbnb en el radio del barrio (AirROI)"
      - name: ocupacion_airbnb_pct
        description: "Ocupación promedio Airbnb en el barrio (%) según AirROI"
      - name: adr_noche_cop
        description: "Average Daily Rate de Airbnb en COP (convertido de USD vía AirROI)"
      - name: yield_airbnb_pct
        description: >
          adr_noche_cop * (ocupacion_airbnb_pct/100) * 365
            / (precio_venta_m2_p50 * area_promedio_m2) * 100.
          Rentabilidad bruta anual estimada por arriendo corto (Airbnb) (%).
          Null si faltan datos de AirROI o de venta.
      - name: pbn_precio_justo
        description: >
          Precio Bruto Normalizado — valor total del inmueble (COP).
          (precio_arriendo_p50 * 100) / 0.6 — valor implícito según arriendo de zona.
          Null si no hay datos de arriendo.
      - name: pmn_neto
        description: >
          Precio Máximo Neto total (COP) = PBN * 0.97.
          PBN descontando 3% costos de cierre estimados.
          Null si no hay datos de arriendo.
      - name: poi_precio_oferta
        description: >
          Precio de Oferta del Inversor total (COP) = PMN * 0.85.
          Precio máximo a ofrecer para garantizar margen del 15%.
          Null si no hay datos de arriendo.
      - name: pbn_precio_justo_m2
        description: >
          PBN normalizado por m² (COP/m²) = pbn_precio_justo / area_promedio_m2.
          Comparable directamente con precio_venta_m2_p50.
          Null si faltan datos de arriendo o area_promedio_m2.
      - name: diferencia_total_pct
        description: >
          Opción A — comparación en totales: ((precio_venta_promedio - PBN) / PBN) * 100.
          Positivo = mercado caro vs fundamentales de arriendo.
          Negativo = oportunidad (mercado bajo precio justo).
          Null si faltan precio_venta_promedio o precio_arriendo_p50.
      - name: diferencia_m2_pct
        description: >
          Opción B — comparación por m²: ((precio_venta_m2_p50 - PBN_m2) / PBN_m2) * 100.
          Misma señal que diferencia_total_pct pero en unidades por m².
          Null si faltan precio_venta_m2_p50, area_promedio_m2 o precio_arriendo_p50.
      - name: estado_precio
        description: >
          Clasificación basada en diferencia_total_pct (totales).
          'SOBRE' = precio_venta_promedio > PBN * 1.10.
          'BAJO'  = precio_venta_promedio < PBN * 0.90 (oportunidad).
          'NORMAL' = dentro del rango ±10%.
          Null si faltan datos de venta o arriendo.
      - name: score_seguridad
        description: >
          score_seguridad_residente (hurto residencia + homicidio), señal principal para el inversor.
          100 = más seguro. Null si el barrio no tiene asignación espacial de comuna.
      - name: score_seguridad_transito
        description: >
          Score de densidad delictiva total (todos los delitos).
          Contexto adicional; distorsionado en zonas turísticas por tráfico peatonal.
      - name: zona_turistica
        description: >
          TRUE para El Poblado, Laureles Estadio, La Candelaria.
          Indica que score_seguridad_transito es menor al real por tráfico de visitantes.
      - name: tendencia_seguridad
        description: >
          Tendencia de criminalidad residente en la comuna del barrio.
          'SUBIENDO' = más crímenes vs año anterior (peor).
          'BAJANDO'  = menos crímenes (mejora).
          'ESTABLE'  = variación ≤5%.
      - name: precio_renta_media_p50
        description: >
          Mediana del precio mensual de renta media en COP (nómadas digitales).
          Fuentes: Flatio, Airbnb (min 28 noches), Homads. Null si sin datos.
      - name: precio_renta_media_usd
        description: "precio_renta_media_p50 en USD. Para comparación directa del inversor extranjero."
      - name: yield_renta_media_pct
        description: >
          (precio_renta_media_p50 * 12) / precio_venta_promedio * 100.
          Rentabilidad bruta anual estimada si se alquila a nómadas digitales (%).
          Null si faltan datos de venta o renta media.
      - name: premium_vs_largo_pct
        description: >
          (precio_renta_media_p50 / precio_arriendo_p50 - 1) * 100.
          Cuánto más cara es la renta media vs arriendo tradicional (%).
          Positivo = el inversor captura ese % extra por alquilar a nómadas.
          Null si faltan datos de arriendo largo o renta media.
      - name: calculado_en
        description: "Timestamp de la última ejecución del modelo"
        tests:
          - not_null

  - name: barrios_renta_media
    description: >
      Métricas de renta media por barrio: mediana de precio mensual, número de listings
      y premium sobre arriendo tradicional. Fuentes: Flatio, AirROI (min 28 noches), Homads.
      Diseñado para el inversor extranjero que quiere alquilar a nómadas digitales.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: barrio_nombre
        description: "Nombre del barrio según raw.barrios"
        tests:
          - not_null
      - name: municipio
        description: "Municipio del Valle de Aburrá"
      - name: n_listings_renta_media
        description: "Total de listings de renta media usados (las 3 fuentes combinadas)"
        tests:
          - not_null
      - name: n_flatio
        description: "Listings de Flatio incluidos en el cálculo"
      - name: n_airbnb_mensual
        description: "Listings de Airbnb (min 28 noches) incluidos"
      - name: n_homads
        description: "Listings de Homads incluidos"
      - name: precio_renta_media_p50
        description: "Mediana del precio mensual de renta media en COP"
      - name: precio_renta_media_usd
        description: "Mediana del precio mensual en USD (vía tasa USD_TO_COP scrapeada de fuente)"
      - name: premium_vs_largo_pct
        description: >
          (precio_renta_media_p50 / arriendo_largo_p50 - 1) * 100.
          Positivo = renta media más cara que arriendo tradicional (upside del inversor).
      - name: arriendo_largo_p50
        description: "Mediana del arriendo tradicional mensual (COP) — base del premium"
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: barrios_top10_yield
    description: >
      Top 10 barrios por yield_renta_media_pct. Vista comparativa de los 3 yields
      (renta media, Airbnb corto plazo, arriendo largo) para el inversor extranjero.
    columns:
      - name: ranking
        description: "Posición 1-10 por yield_renta_media_pct descendente"
        tests:
          - not_null
          - unique
      - name: barrio
        description: "Nombre del barrio"
        tests:
          - not_null
      - name: yield_media_pct
        description: "Rentabilidad bruta anual por renta media (nómadas digitales) (%)"
      - name: yield_airbnb_pct
        description: "Rentabilidad bruta anual por Airbnb corto plazo (%)"
      - name: yield_largo_pct
        description: "Rentabilidad bruta anual por arriendo tradicional (%)"
      - name: premium_vs_largo_pct
        description: "Cuánto más paga un nómada vs un inquilino local (%)"
      - name: n_listings
        description: "Listings de renta media en la zona (confiabilidad de la métrica)"

  - name: barrios_airbnb_real
    description: >
      Métricas reales de Airbnb por barrio, agregadas desde los listings individuales del
      AirROI Data Portal (300 listings, TTM reales). Reemplaza la estimación de barrios_mercado
      que usaba datos mock de raw.airbnb_barrios.
      Incluye comparación real vs mock para validar diferencias.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: barrio_nombre
        description: "Nombre del barrio según raw.barrios"
        tests:
          - not_null
      - name: municipio
        description: "Municipio del Valle de Aburrá"
        tests:
          - not_null
      - name: n_listings_airbnb
        description: "Listings individuales con barrio_id asignado y métricas TTM válidas"
        tests:
          - not_null
      - name: ocupacion_p50_pct
        description: "Mediana de ocupación real TTM por listing (%)"
      - name: adr_p50_usd
        description: "Mediana del ADR real TTM en USD/noche"
      - name: adr_p50_cop
        description: "Mediana del ADR real TTM en COP/noche"
      - name: ingresos_anuales_p50_usd
        description: "Ingreso anual estimado mediano por listing (ADR_p50 × ocupacion_p50 × 365) en USD"
      - name: yield_airbnb_real_pct
        description: >
          Yield Airbnb real = (ADR_p50_USD × ocupacion_p50 × 365) /
          (precio_venta_m2_p50_COP / fx × area_promedio_m2) × 100.
          Null si faltan datos de venta del barrio.
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: barrios_seguridad
    description: >
      Índice de seguridad propagado a nivel barrio.
      Une barrios (geométricamente) a comunas y hereda los scores de stg_seguridad.
      score_seguridad_residente es la señal principal para el inversor (hurto residencia + homicidio).
      score_seguridad_transito es contexto adicional, distorsionado en zonas turísticas.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: nombre_barrio
        description: "Nombre del barrio"
      - name: comuna
        description: "Nombre de la comuna (via join espacial)"
      - name: codigo_comuna
        description: "Código de la comuna (01-16)"
      - name: zona_turistica
        description: "TRUE para El Poblado, Laureles Estadio, La Candelaria"
      - name: casos_residente_3anios
        description: "Casos de hurto a residencia + homicidio en la comuna, últimos 3 años"
      - name: casos_residente_por_1000hab
        description: "Tasa de criminalidad residente cada 1000 habitantes"
      - name: casos_totales_3anios
        description: "Total de todos los delitos en la comuna, últimos 3 años"
      - name: casos_por_1000hab
        description: "Tasa total de criminalidad cada 1000 habitantes"
      - name: score_seguridad_residente
        description: "Score 0-100. Señal principal. 100 = más seguro para residir."
      - name: ranking_seguridad
        description: "Ranking por score_seguridad_residente. 1 = más seguro."
      - name: score_seguridad_transito
        description: "Score 0-100 por densidad delictiva total. Contexto, no señal principal."
      - name: tendencia
        description: "'SUBIENDO' | 'BAJANDO' | 'ESTABLE' vs año anterior (delitos residentes)"

  - name: barrios_score
    description: >
      Score consolidado de inversión 0-100 por barrio. Combina yield (35 pts),
      estado de precio PBN (25 pts), seguridad (20 pts), conectividad al metro (15 pts)
      y confiabilidad de datos (5 pts). Fuente primaria para el mapa Mapbox y el ranking
      de inversión del inversor extranjero.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: nombre_barrio
        description: "Nombre del barrio según raw.barrios"
        tests:
          - not_null
      - name: comuna
        description: "Nombre de la comuna"
      - name: estrato
        description: "Estrato socioeconómico (1-6). NULL hasta que se integre fuente catastral."
      - name: score_total
        description: "Score consolidado 0-100. Suma de los 5 componentes."
        tests:
          - not_null
      - name: categoria_inversion
        description: "'EXCELENTE' (80-100) | 'BUENO' (60-79) | 'MODERADO' (40-59) | 'BAJO' (20-39) | 'MUY BAJO' (0-19)"
        tests:
          - not_null
          - accepted_values:
              values: ['EXCELENTE', 'BUENO', 'MODERADO', 'BAJO', 'MUY BAJO']
      - name: color_hex
        description: "Color HEX para Mapbox según categoría. Verde=#10b981, Cyan=#00d4ff, Ámbar=#f59e0b, Rojo=#ef4444, Gris=#6b7280"
        tests:
          - not_null
      - name: score_yield
        description: "Componente yield (0-35 pts). Basado en el mejor yield disponible entre Airbnb real, Airbnb mock, largo plazo y renta media."
        tests:
          - not_null
      - name: score_precio
        description: "Componente precio PBN (0-25 pts). BAJO=25, NORMAL=15, SOBRE=5, NULL=0."
        tests:
          - not_null
      - name: score_seguridad
        description: "Componente seguridad (0-20 pts). score_seguridad_residente/100*20. NULL→10 pts neutros."
        tests:
          - not_null
      - name: score_conectividad
        description: "Componente conectividad al metro (0-15 pts). NULL→5 pts hasta que se integre fuente geoespacial de estaciones."
        tests:
          - not_null
      - name: score_confiabilidad
        description: "Componente volumen de datos (1-5 pts). n_venta + n_arriendo + n_listings_airbnb."
        tests:
          - not_null
      - name: mejor_yield_pct
        description: "Mayor yield disponible por barrio (%). Máximo entre yield_airbnb_real, yield_airbnb_mock, yield_largo y yield_renta_media."
      - name: mejor_tipo_renta
        description: "'AIRBNB' | 'RENTA_MEDIA' | 'LARGO_PLAZO'. Tipo de renta que produce el mejor yield."
      - name: estado_precio
        description: "'BAJO' | 'NORMAL' | 'SOBRE'. Precio de venta vs PBN calculado desde arriendo (±10%)."
      - name: categoria_seguridad
        description: "'MUY SEGURO' | 'SEGURO' | 'MODERADO' | 'PRECAUCIÓN' | 'ALTO RIESGO'. Heredado de barrios_seguridad."
      - name: dist_metro_km
        description: "Distancia en km a la estación de metro más cercana. NULL hasta que se integre capa geoespacial de estaciones."
      - name: n_datos_total
        description: "Total de registros disponibles para el barrio (n_venta + n_arriendo + n_listings_airbnb). Proxy de confiabilidad."
      - name: precio_m2_venta
        description: "Mediana del precio de venta por m² en COP (precio_venta_m2_p50 de barrios_mercado)."
      - name: arriendo_p50
        description: "Mediana del arriendo mensual en COP (apartamento, largo plazo)."
      - name: score_airbnb_ocupacion
        description: "Tasa de ocupación Airbnb (%). Real si disponible, mock AirROI como fallback."
      - name: adr_cop
        description: "Average Daily Rate en COP. Real si disponible, mock AirROI como fallback."
      - name: calculado_en
        description: "Timestamp de la última ejecución del modelo."
        tests:
          - not_null

  - name: barrios_renta_segmentada
    description: >
      Métricas Airbnb por barrio y tipo de renta (renta_corta / renta_media / renta_larga_airbnb).
      Segmentación basada en ttm_avg_length_of_stay real TTM de los 300 listings del AirROI Portal.
      Sin scrapers adicionales — aprovecha campos ya cargados en raw.airbnb_listings_portal.
      Yield calculado con precio de venta de stg_listings (no de barrios_mercado, para evitar ciclo).
    columns:
      - name: barrio_id
        description: "PK parcial — FK a raw.barrios"
        tests:
          - not_null
      - name: tipo_renta
        description: "'renta_corta' | 'renta_media' | 'renta_larga_airbnb'"
        tests:
          - not_null
          - accepted_values:
              values: ['renta_corta', 'renta_media', 'renta_larga_airbnb']
      - name: n_listings
        description: "Listings del segmento con barrio_id y métricas TTM válidas"
        tests:
          - not_null
      - name: ocupacion_p50
        description: "Mediana de ocupación del segmento (%)"
      - name: adr_p50_usd
        description: "Mediana del ADR del segmento en USD/noche"
      - name: adr_p50_cop
        description: "Mediana del ADR del segmento en COP/noche"
      - name: revenue_anual_p50_usd
        description: "Ingreso anual estimado mediano (ADR_p50 × ocupacion_p50 × 365) en USD"
      - name: yield_pct
        description: >
          yield = (ADR_p50_USD × ocupacion_p50 × 365) /
          ((precio_venta_m2_p50_COP / 4100) × area_promedio_m2) × 100.
          Null si no hay datos de venta en el barrio.
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: comparador_renta
    description: >
      Vista pivotada: un barrio por fila con los 3 tipos de renta side-by-side.
      Solo muestra barrios con datos en al menos 2 de los 3 tipos (yield no null).
      Incluye campo mejor_opcion = tipo con mayor yield para decisión rápida del inversor.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: barrio_nombre
        description: "Nombre del barrio"
        tests:
          - not_null
      - name: yield_corta
        description: "Yield Airbnb renta corta (<7 días avg stay) (%)"
      - name: occ_corta
        description: "Ocupación mediana renta corta (%)"
      - name: adr_corta
        description: "ADR mediana renta corta (USD/noche)"
      - name: yield_media
        description: "Yield Airbnb renta media (7-29 días avg stay) (%)"
      - name: occ_media
        description: "Ocupación mediana renta media (%)"
      - name: adr_media
        description: "ADR mediana renta media (USD/noche)"
      - name: yield_larga
        description: "Yield Airbnb renta larga (>=30 días avg stay) (%)"
      - name: occ_larga
        description: "Ocupación mediana renta larga (%)"
      - name: adr_larga
        description: "ADR mediana renta larga (USD/noche)"
      - name: tipos_con_datos
        description: "Cuántos tipos de renta tienen yield calculado (2 o 3)"
      - name: mejor_opcion
        description: "'renta_corta' | 'renta_media' | 'renta_larga_airbnb' — tipo con mayor yield"

  - name: score_corto_plazo
    description: >
      Score Airbnb 0-100 por barrio. Perfil inversor corto plazo.
      Componentes: yield Airbnb real (40 pts), rating_location promedio (15 pts),
      volumen listings (15 pts), ocupación real TTM (20 pts), dist al mall (10 pts).
      Fuentes: barrios_mercado + barrios_airbnb_real + raw.airbnb_listings_portal + barrios_pois_distancia.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: nombre_barrio
        description: "Nombre del barrio según raw.barrios"
        tests:
          - not_null
      - name: score_corto
        description: "Score Airbnb 0-100. Suma de 5 componentes."
        tests:
          - not_null
      - name: categoria_corto
        description: "'EXCELENTE' (80-100) | 'BUENO' (60-79) | 'MODERADO' (40-59) | 'BAJO' (20-39) | 'MUY BAJO' (0-19)"
        tests:
          - not_null
          - accepted_values:
              values: ['EXCELENTE', 'BUENO', 'MODERADO', 'BAJO', 'MUY BAJO']
      - name: color_corto
        description: "Color HEX para Mapbox según categoría."
        tests:
          - not_null
      - name: yield_score
        description: "Pts yield Airbnb real (0-40). Basado en mejor_yield_airbnb."
        tests:
          - not_null
      - name: rating_score
        description: "Pts rating_location promedio (0-15). NULL→8 pts neutros."
        tests:
          - not_null
      - name: listings_score
        description: "Pts volumen listings Airbnb (0-15)."
        tests:
          - not_null
      - name: ocupacion_score
        description: "Pts ocupación real TTM p50 (0-20). NULL→8 pts neutros."
        tests:
          - not_null
      - name: mall_score
        description: "Pts distancia al mall más cercano (0-10)."
        tests:
          - not_null
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: score_mediano_plazo
    description: >
      Score Nómadas Digitales 0-100 por barrio. Perfil inversor mediano plazo (renta media).
      Componentes: yield renta media (25 pts), índice vida nómada con yoga (30 pts),
      precio PBN (18 pts), seguridad percibida (12 pts), índice verde (10 pts),
      score equipamiento Airbnb (5 pts). Total = 100.
      Fuentes: barrios_mercado + barrios_seguridad + barrios_pois_distancia
               + barrios_verde + barrios_amenities + raw.airbnb_listings_portal.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: nombre_barrio
        description: "Nombre del barrio según raw.barrios"
        tests:
          - not_null
      - name: score_mediano
        description: "Score Nómadas 0-100. Suma de 4 componentes."
        tests:
          - not_null
      - name: categoria_mediano
        description: "'EXCELENTE PARA NÓMADAS' | 'BUENO PARA NÓMADAS' | 'MODERADO' | 'BAJO' | 'MUY BAJO'"
        tests:
          - not_null
          - accepted_values:
              values: ['EXCELENTE PARA NÓMADAS', 'BUENO PARA NÓMADAS', 'MODERADO', 'BAJO', 'MUY BAJO']
      - name: color_mediano
        description: "Color HEX para Mapbox según categoría."
        tests:
          - not_null
      - name: yield_medio_score
        description: "Pts yield inversor — renta media o Airbnb segmento medio (0-25)."
        tests:
          - not_null
      - name: nomada_score
        description: "Pts atractivo nómada — indice_nomada (con yoga) normalizado 0-30."
        tests:
          - not_null
      - name: pbn_score
        description: "Pts precio PBN (0-18). BAJO=18, NORMAL=11, SOBRE=3, NULL=0."
        tests:
          - not_null
      - name: seg_medio_score
        description: "Pts seguridad percibida nómada — rating_location + tendencia_seguridad (0-12)."
        tests:
          - not_null
      - name: pts_verde
        description: "Pts índice verde (0-15, escalado a 10 en score final × 0.67 implícito via score_verde)."
        tests:
          - not_null
      - name: pts_equip
        description: "Pts equipamiento Airbnb (0-5). score_equipamiento × 0.5."
        tests:
          - not_null
      - name: n_yoga
        description: "Yoga studios / estudios de danza en radio 1km del centroide del barrio."
      - name: indice_verde_pct
        description: "Cobertura verde estimada (%) — proxy basado en centroides de parques OSM."
      - name: categoria
        description: "'MUY VERDE' | 'VERDE' | 'MODERADO' | 'POCO VERDE'"
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: score_largo_plazo
    description: >
      Score Arriendo Tradicional 0-100 por barrio. Perfil inversor largo plazo.
      Componentes: PBN precio (30 pts), yield bruto largo (25 pts),
      seguridad residente (25 pts), conectividad metro (10 pts),
      valorización histórica IPVN (10 pts — NUEVO).
      Fuentes: barrios_mercado + barrios_pois_distancia + proyecciones_valorizacion.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: nombre_barrio
        description: "Nombre del barrio según raw.barrios"
        tests:
          - not_null
      - name: score_largo
        description: "Score Arriendo Largo 0-100. Suma de 4 componentes."
        tests:
          - not_null
      - name: categoria_largo
        description: "'EXCELENTE' | 'BUENO' | 'MODERADO' | 'BAJO' | 'MUY BAJO'"
        tests:
          - not_null
          - accepted_values:
              values: ['EXCELENTE', 'BUENO', 'MODERADO', 'BAJO', 'MUY BAJO']
      - name: color_largo
        description: "Color HEX para Mapbox según categoría."
        tests:
          - not_null
      - name: pbn_largo_score
        description: "Pts precio PBN (0-35). BAJO=35, NORMAL=20, SOBRE=5."
        tests:
          - not_null
      - name: yield_largo_score
        description: "Pts yield bruto largo plazo (0-30)."
        tests:
          - not_null
      - name: seg_largo_score
        description: "Pts seguridad residente (0-25). score_seguridad_residente/100*25. NULL→50/100*25=12 pts."
        tests:
          - not_null
      - name: metro_largo_score
        description: "Pts conectividad metro (0-10)."
        tests:
          - not_null
      - name: valorizacion_score
        description: "Pts valorización histórica IPVN (0-10). ACELERANDO=10, ESTABLE=6, DESACELERANDO=2, NULL=5."
        tests:
          - not_null
      - name: tendencia_valorizacion
        description: "'ACELERANDO' | 'ESTABLE' | 'DESACELERANDO' — de proyecciones_valorizacion."
      - name: var_anual_5anos_pct
        description: "Variación anual promedio 5 años ajustada por estrato del barrio (%)."
      - name: estrato_barrio
        description: "Estrato del barrio (1-6). NULL hasta integración fuente catastral."
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: proyecciones_valorizacion
    description: >
      Proyecciones de valorización de vivienda nueva por estrato (1-6) en Medellín.
      Nivel ciudad — IPVN DANE total con ajuste por estrato.
      Ajuste: estrato 5-6 ×1.15 | estrato 4 ×1.05 | estrato 3 ×1.00 | estrato 1-2 ×0.90.
      Una fila por estrato (6 filas totales).
    columns:
      - name: estrato_sistema
        description: "Estrato del sistema (1-6)"
        tests:
          - not_null
          - unique
      - name: factor_ajuste
        description: "Multiplicador de valorización vs baseline ciudad"
        tests:
          - not_null
      - name: baseline_5anos_pct
        description: "Variación anual promedio ciudad últimos 5 años (%)"
        tests:
          - not_null
      - name: baseline_3anos_pct
        description: "Variación anual promedio ciudad últimos 3 años (%)"
        tests:
          - not_null
      - name: baseline_ultimo_anio_pct
        description: "Variación anual último año completo disponible (%)"
      - name: var_5anos_ajustado
        description: "baseline_5anos_pct × factor_ajuste"
        tests:
          - not_null
      - name: var_3anos_ajustado
        description: "baseline_3anos_pct × factor_ajuste"
        tests:
          - not_null
      - name: tendencia_reciente
        description: >
          Compara último año vs promedio 5 años (±5% umbral):
          'ACELERANDO' | 'ESTABLE' | 'DESACELERANDO'
        tests:
          - not_null
          - accepted_values:
              values: ['ACELERANDO', 'ESTABLE', 'DESACELERANDO']
      - name: proyeccion_3anos_pct
        description: "Proyección acumulada a 3 años: var_3anos_ajustado × 3"
        tests:
          - not_null
      - name: proyeccion_5anos_pct
        description: "Proyección acumulada a 5 años: var_5anos_ajustado × 5"
        tests:
          - not_null
      - name: calculado_en
        description: "Timestamp de ejecución"
        tests:
          - not_null

  - name: barrios_liquidez
    description: >
      Índice de actividad y liquidez de mercado por barrio.
      Usa días_en_mercado de listings de venta para medir velocidad de rotación real.
      Calcula liquidez_score (0-100) combinando rotación, listings frescos, volumen e interés Airbnb.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: precio_venta_m2_p50
        description: "Mediana precio/m² en venta COP (de barrios_mercado)"
      - name: n_listings_venta_total
        description: "Total listings de venta activos en el barrio"
        tests:
          - not_null
      - name: dias_mercado_p50
        description: "Mediana de días en mercado (desde fecha_publicacion o fecha_scraping)"
      - name: dias_mercado_p25
        description: "Percentil 25 de días en mercado"
      - name: pct_frescos
        description: "Porcentaje de listings con dias_en_mercado < 30"
      - name: pct_antiguos
        description: "Porcentaje de listings con dias_en_mercado > 90"
      - name: pct_listings_con_fecha
        description: "Fracción de listings con fecha_publicacion real (0-1). >= 0.5 = datos confiables"
      - name: n_listings_airbnb
        description: "Listings Airbnb activos en el barrio (proxy de interés turístico)"
      - name: liquidez_score
        description: "Score de liquidez 0-100. 40 pts rotación + 20 pts frescos + 25 pts volumen + 15 pts interés"
        tests:
          - not_null
      - name: categoria_liquidez
        description: "'ALTA' (>=70) | 'MEDIA' (>=45) | 'BAJA' (>=25) | 'MUY BAJA' (<25)"
        tests:
          - not_null
          - accepted_values:
              values: ['ALTA', 'MEDIA', 'BAJA', 'MUY BAJA']
      - name: tiempo_estimado_venta
        description: "'1-3 meses' | '3-6 meses' | '6-12 meses' | '+12 meses'"
        tests:
          - not_null
      - name: nota_metodologia
        description: "Descripción de confiabilidad del score. Cambia según pct_listings_con_fecha."
        tests:
          - not_null
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: barrios_verde
    description: >
      Índice de verde por barrio. Estima cobertura de parques usando centroides OSM
      (proxy: 5 000 m² por parque). score_verde 0-15 pts para score nómada mediano plazo.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: nombre_barrio
        description: "Nombre del barrio"
        tests:
          - not_null
      - name: n_parques
        description: "Parques con centroide dentro del barrio (raw.pois tipo='parque')"
        tests:
          - not_null
      - name: area_barrio_m2
        description: "Área del barrio en m² (ST_Area geography)"
      - name: area_parques_estimada_m2
        description: "Estimado de área verde: n_parques × 5 000 m²"
      - name: indice_verde_pct
        description: "area_parques_estimada_m2 / area_barrio_m2 × 100 (%)"
      - name: categoria_verde
        description: "'MUY VERDE' (>=20%) | 'VERDE' (>=10%) | 'MODERADO' (>=5%) | 'POCO VERDE' (<5%)"
        tests:
          - not_null
          - accepted_values:
              values: ['MUY VERDE', 'VERDE', 'MODERADO', 'POCO VERDE']
      - name: score_verde
        description: "Puntos para score nómada: MUY VERDE=15, VERDE=10, MODERADO=6, POCO VERDE=2"
        tests:
          - not_null
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: barrios_amenities
    description: >
      Score de equipamiento Airbnb por barrio. Agrega flags de amenidades
      desde stg_airbnb_amenities (parsed del campo amenities de AirROI CSV).
      score_equipamiento 0-10 pts (escalado a 0-5 en score_mediano_plazo).
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: nombre_barrio
        description: "Nombre del barrio"
        tests:
          - not_null
      - name: n_listings
        description: "Listings con barrio_id usados en el cálculo"
        tests:
          - not_null
      - name: pct_wifi
        description: "% listings con wifi / internet"
      - name: pct_ac
        description: "% listings con aire acondicionado"
      - name: pct_kitchen
        description: "% listings con cocina"
      - name: pct_washer
        description: "% listings con lavadora"
      - name: score_equipamiento
        description: "0-10 pts: pct_wifi>=90%→+4, pct_kitchen>=80%→+3, pct_ac>=60%→+2, pct_washer>=50%→+1"
        tests:
          - not_null
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: barrios_oportunidades
    description: >
      Detección automática de oportunidades de inversión por barrio.
      Combina estado_precio (PBN), yield_bruto y liquidez_score para señalar barrios accionables.
      3 tipos: PRECIO BAJO MERCADO | ALTO RENDIMIENTO | INVERSIÓN SEGURA.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: nombre_barrio
        description: "Nombre del barrio"
        tests:
          - not_null
      - name: oportunidad_detectada
        description: "TRUE si el barrio cumple alguna condición de oportunidad"
        tests:
          - not_null
      - name: tipo_oportunidad
        description: "'PRECIO BAJO MERCADO' | 'ALTO RENDIMIENTO' | 'INVERSIÓN SEGURA' | NULL"
        tests:
          - accepted_values:
              values: ['PRECIO BAJO MERCADO', 'ALTO RENDIMIENTO', 'INVERSIÓN SEGURA']
              config:
                where: "tipo_oportunidad IS NOT NULL"
      - name: descripcion_oportunidad
        description: "Texto explicativo de la oportunidad con números concretos para el inversor"
      - name: score_relevante
        description: "Score del perfil más relevante para el tipo de oportunidad (0-100)"
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null

  - name: barrios_score_consolidado
    description: >
      Vista consolidada de los 3 scores por barrio. Un registro por barrio.
      Incluye score_corto (Airbnb), score_mediano (Nómadas) y score_largo (Arriendo),
      categorías, colores HEX y perfil_recomendado (el score más alto gana).
      También expone índice verde, score equipamiento y liquidez.
      Fuente para el mapa Mapbox con selector de perfil de inversor.
    columns:
      - name: barrio_id
        description: "PK — FK a raw.barrios"
        tests:
          - not_null
          - unique
      - name: nombre_barrio
        description: "Nombre del barrio"
        tests:
          - not_null
      - name: score_corto
        description: "Score Airbnb 0-100"
      - name: categoria_corto
        description: "'EXCELENTE' | 'BUENO' | 'MODERADO' | 'BAJO' | 'MUY BAJO'"
      - name: score_mediano
        description: "Score Nómadas 0-100"
      - name: categoria_mediano
        description: "'EXCELENTE PARA NÓMADAS' | 'BUENO PARA NÓMADAS' | 'MODERADO' | 'BAJO' | 'MUY BAJO'"
      - name: score_largo
        description: "Score Arriendo Largo 0-100"
      - name: categoria_largo
        description: "'EXCELENTE' | 'BUENO' | 'MODERADO' | 'BAJO' | 'MUY BAJO'"
      - name: perfil_recomendado
        description: "'AIRBNB' | 'NOMADAS' | 'ARRIENDO_LARGO' — perfil con mayor score en el barrio"
        tests:
          - not_null
          - accepted_values:
              values: ['AIRBNB', 'NOMADAS', 'ARRIENDO_LARGO']
      - name: liquidez_score
        description: "Score de liquidez 0-100 (de barrios_liquidez)"
      - name: categoria_liquidez
        description: "'ALTA' | 'MEDIA' | 'BAJA' | 'MUY BAJA'"
      - name: tiempo_estimado_venta
        description: "Tiempo estimado para vender el inmueble"
      - name: nota_metodologia
        description: "Nota de transparencia sobre la fuente de datos de liquidez"
      - name: indice_verde_pct
        description: "Cobertura verde estimada por barrio (%) — de barrios_verde"
      - name: categoria_verde
        description: "'MUY VERDE' | 'VERDE' | 'MODERADO' | 'POCO VERDE'"
      - name: score_verde
        description: "Pts verde (0-15) — de barrios_verde"
      - name: pct_wifi
        description: "% listings Airbnb con wifi — de barrios_amenities"
      - name: pct_ac
        description: "% listings Airbnb con AC — de barrios_amenities"
      - name: pct_kitchen
        description: "% listings Airbnb con cocina — de barrios_amenities"
      - name: pct_washer
        description: "% listings Airbnb con lavadora — de barrios_amenities"
      - name: score_equipamiento
        description: "Score equipamiento Airbnb 0-10 — de barrios_amenities"
      - name: calculado_en
        description: "Timestamp de la última ejecución"
        tests:
          - not_null
